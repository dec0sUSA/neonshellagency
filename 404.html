  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0c;
      --bg-elev: #121216;
      --lavender: #d8b4fe;
      --cyan: #22d3ee;
      --muted: #a78bfa;
      --dim: #8a76b8;
      --border: rgba(216, 180, 254, 0.18);
    }
    html { overflow-x: clip; }
    body {
      background: var(--bg);
      color: var(--lavender);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      -webkit-font-smoothing: antialiased;
      line-height: 1.65;
      min-height: 100dvh;
      overflow-x: clip;
      font-size: 16px;
    }
    .glow {
      text-shadow:
        0 0 6px rgba(216, 180, 254, 0.35),
        0 0 16px rgba(216, 180, 254, 0.16);
    }
    .wrap {
      width: min(100%, 72ch);
      margin: 0 auto;
      padding: 1.5rem clamp(1rem, 4vw, 1.25rem) 2.5rem;
      text-align: center;
    }
    /* Option C header logo (Hands) */
    .nsl-header { text-align:center; padding:1.5rem 0 1.75rem; }
    .nsl-header a { display:inline-block; line-height:0; }
    .nsl-header .nsl-logo { display:block; width:min(100%,360px); height:auto; margin:0 auto; }
    @media (min-width: 768px) { .nsl-header .nsl-logo { width: min(100%, 640px); } }

    h1 {
      font-size: clamp(1.05rem, 4.8vw, 1.55rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--lavender);
      margin: 0 0 0.75rem;
      line-height: 1.35;
    }
    .lede {
      color: var(--muted);
      margin: 0 auto 1.75rem;
      max-width: 60ch;
      font-size: 16px;
      line-height: 1.65;
    }
    .home-link {
      display: inline-block;
      margin: 0 0 1.5rem;
      color: var(--cyan);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.9rem 1.35rem;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--bg);
      background: var(--lavender);
      text-decoration: none;
      border-radius: 4px;
      border: 2px solid transparent;
      box-shadow:
        0 0 12px rgba(216, 180, 254, 0.55),
        0 0 32px rgba(216, 180, 254, 0.22);
    }
    .cta:hover, .cta:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }
    .cta-secondary {
      color: var(--lavender);
      background: transparent;
      border: 2px solid var(--lavender);
      box-shadow: none;
    }
    .cta-secondary:hover, .cta-secondary:focus-visible {
      color: var(--bg);
      background: var(--lavender);
    }
    .cta.beeper {
      position: relative;
      padding: 1.2rem 1.4rem;
      font-weight: 700;
      white-space: nowrap;
      color: #1a0b2e;
      background:
        repeating-linear-gradient(0deg, rgba(26,11,46,.07) 0 1px, transparent 1px 3px),
        linear-gradient(180deg, #e4cbff 0%, #c9a6ff 100%);
      border: 3px solid #22d3ee;
      border-radius: 10px;
      outline: 6px solid #120a1f;
      outline-offset: 0;
      box-shadow:
        inset 0 2px 6px rgba(26,11,46,.45),
        inset 0 -1px 0 rgba(255,255,255,.35),
        0 0 0 8px #1b1030,
        0 0 18px rgba(34,211,238,.55),
        0 0 36px rgba(185,140,255,.45);
    }
    .cta-row {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.85rem;
      margin: 0.25rem 0 0.5rem;
      padding: 0.85rem;
    }
    .cta-row .cta { width: 100%; max-width: 100%; }
    @media (min-width: 560px) {
      .cta-row { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; }
      .cta-row .cta { width: auto; }
    }
    .email-vis {
      margin: 0.35rem 0 0.7rem;
      font-size: 16px;
      color: var(--lavender);
    }
    .email-vis a {
      color: var(--lavender);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .phone-note, .domain {
      color: var(--dim);
      margin-top: 0.5rem;
    }
    .domain {
      color: #f3e8ff;
      letter-spacing: 0.04em;
    }

    .cta-call-glow {
      color: #061015;
      background: linear-gradient(180deg, #a5f3fc 0%, #22d3ee 55%, #67e8f9 100%);
      border: 2px solid #ecfeff;
      font-weight: 700;
      box-shadow:
        0 0 10px rgba(34, 211, 238, 0.9),
        0 0 24px rgba(34, 211, 238, 0.65),
        0 0 48px rgba(167, 139, 250, 0.45),
        0 0 4px rgba(255, 255, 255, 0.5);
      text-shadow: none;
    }
    .sticky-cta { display: none; }
    @media (max-width: 767px) {
      .sticky-cta {
        display: flex;
        position: fixed;
        left: 0; right: 0; bottom: 0;
        z-index: 80;
        gap: 0.5rem;
        padding: 0.5rem 0.75rem calc(0.5rem + env(safe-area-inset-bottom, 0px));
        background: rgba(10, 10, 12, 0.94);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-top: 1px solid var(--border);
      }
      .sticky-cta a {
        flex: 1 1 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0.65rem 0.75rem;
        font: inherit;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-decoration: none;
        border-radius: 6px;
      }
      .sticky-cta-quote {
        color: var(--lavender);
        background: transparent;
        border: 2px solid var(--lavender);
      }
      .sticky-cta-call {
        color: #061015;
        background: linear-gradient(180deg, #a5f3fc 0%, #22d3ee 60%, #67e8f9 100%);
        border: 2px solid #ecfeff;
        box-shadow: 0 0 10px rgba(34, 211, 238, 0.7), 0 0 22px rgba(34, 211, 238, 0.4);
        flex: 1.35 1 0;
        font-size: 0.7rem;
        letter-spacing: 0.01em;
        padding: 0.65rem 0.4rem;
        white-space: nowrap;
      }
      body { padding-bottom: calc(4.75rem + 1.25rem + env(safe-area-inset-bottom, 0px)); }
      .cta-row {
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: stretch;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.4rem 0.85rem;
      }
      .cta-row .cta {
        width: auto;
        flex: 1 1 0;
        min-width: 0;
        font-size: 0.82rem;
        padding: 0.7rem 0.45rem;
        white-space: nowrap;
      }
    }
    @media (max-width: 430px) {
      header .cta-row .cta {
        font-size: 0.78rem;
        padding: 0.7rem 12px;
        white-space: nowrap;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
